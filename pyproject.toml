[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-sync"
version = "0.1.0"
description = "Cross-machine conversation migration and sync tool for Antigravity runtime."
readme = "README.md"
authors = [{ name = "kamus" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["antigravity", "cli", "sync", "migration", "backup", "conversations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
antigravity-sync = "antigravity_sync.cli:main"
agy-sync = "antigravity_sync.cli:main"
